name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove existing rules to avoid conflicts
          netsh advfirewall firewall delete rule name="RDP-Ngrok"
          
          # Allow incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Ngrok" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          # إصلاح: إزالة الخطوط المائلة العكسية لتعريف المتغيرات بشكل صحيح في PowerShell
          \$password = "KamelRDP@2026!"
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Download and Extract Ngrok
        run: |
          # إصلاح: وضع الرابط المباشر والصحيح لملف Ngrok التنفيذي لويندوز
          Invoke-WebRequest "https://equinox.io" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath "\$env:USERPROFILE"
          Remove-Item ngrok.zip
          Copy-Item "\(env:USERPROFILE\ngrok.exe" "\)env:GITHUB_WORKSPACE"

      - name: Authenticate Ngrok
        run: |
          \$ErrorActionPreference = "Stop"
          # ربط حسابك عبر الـ Token المضاف في إعدادات GitHub
          .\ngrok.exe config add-authtoken "\${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel
        run: |
          Start-Process -FilePath "\$pwd\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -RedirectStandardOutput ngrok.log

          \$tunnelUrl = \(null\)timeout = 60

          while (timeout -gt 0 -and -not tunnelUrl) {
            Start-Sleep -Seconds 5
            \$timeout -= 5
            try {
              \$response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              tunnelUrl = response.tunnels[0].public_url -replace "tcp://", ""
            } catch {
              \$logContent = Get-Content ngrok.log -ErrorAction SilentlyContinue
              if (\$logContent -match "url=tcp://(?<url>[a-zA-Z0-9\.\-]+:\d+)") {
                  tunnelUrl = Matches['url']
              }
            }
          }

          if (-not \$tunnelUrl) {
            Write-Output "::error::Ngrok tunnel could not be established"
            exit 1
          }

          Write-Output "============================================"
          Write-Output "||     ✅ RDP CONNECTION DETAILS         ||"
          Write-Output "============================================"
          Write-Output "Address: \$tunnelUrl"
          Write-Output "Username: RDP"
          Write-Output "Password: KamelRDP@2026!"
          Write-Output "--------------------------------------------"
          Write-Output "Instructions:"
          Write-Output "قم بنسخ الرابط وضعه مباشرة في تطبيق الـ RDP دون الحاجة لـ VPN"
          Write-Output "============================================"

          while (\$true) { Start-Sleep -Seconds 300 }

      - name: Cleanup Ngrok
        if: always()
        run: |
          Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
